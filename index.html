<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Holanda | Dashboard Au Pair</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Biblioteca oficial de Gráficos Chart.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <main class="dashboard-container">
        <!-- Lado Esquerdo: Painel de Configurações -->
        <section class="panel-left">
            <header class="app-header">
                <span class="badge">Fase 1: Preparação</span>
                <h1>Missão Holanda</h1>
                <p>Simule suas metas de poupança no Brasil e o poder de compra da sua mesada de Au Pair.</p>
            </header>

            <div class="calculator-card">
                <!-- Status de Conexão com o Câmbio -->
                <div id="statusCotacao" class="api-status">
                    Sincronizando câmbio de Haia...
                </div>

                <!-- Entrada 1: Mesada em Euros -->
                <div class="input-group">
                    <label for="valorEuro">Mesada Mensal na Holanda (Euros €)</label>
                    <input type="number" id="valorEuro" value="340">
                </div>

                <!-- Entrada 2: Poupança no Brasil -->
                <div class="input-group">
                    <label for="poupancaMensal">Aporte Mensal no Brasil (R$)</label>
                    <input type="number" id="poupancaMensal" value="1400">
                </div>

                <!-- Botão Principal -->
                <button id="botaoCalcular" class="btn-primary">
                    Simular Cenário
                </button>
            </div>
        </section>

        <!-- Lado Direito: Painel de Resultados -->
        <section class="panel-right">
            <div id="painelResultados" class="results-grid">
                
                <!-- Card 1: Valor do Euro -->
                <div class="data-card">
                    <span class="card-label">Euro Comercial Hoje</span>
                    <h3 id="valorCotacaoApi">R$ 0,00</h3>
                </div>

                <!-- Card 2: Conversão da Mesada -->
                <div class="data-card">
                    <span class="card-label">Poder de Compra (Mesada)</span>
                    <h3 id="resultadoReal">R$ 0,00</h3>
                </div>

                <!-- Card 3: Tempo até o objetivo -->
                <div class="data-card">
                    <span class="card-label">Tempo para Meta (Fundo R$ 20k)</span>
                    <h3 id="tempoMeta">-- meses</h3>
                </div>

                <!-- Card 4: Área do Gráfico -->
                <div class="data-card chart-card">
                    <span class="card-label">Projeção de Acumulação no Brasil</span>
                    <div class="chart-wrapper">
                        <canvas id="graficoProjecao"></canvas>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
